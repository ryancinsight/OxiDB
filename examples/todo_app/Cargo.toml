[package]
name = "todo_app"
version = "0.1.0"
edition = "2021"
description = "Todo application example using OxiDB"
license = "MIT"
repository = "https://github.com/ryancinsight/OxiDB"
keywords = ["database", "todo", "example"]
categories = ["database-implementations"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
oxidb = { path = "../.." } # Assuming oxidb is at the root of the repo
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
