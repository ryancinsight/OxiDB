[package]
name = "oxidb_datatype_constraint_tests"
version = "0.1.0"
edition = "2021"
description = "Test suite for OxiDB data type constraints and validation"
license = "MIT"
repository = "https://github.com/ryancinsight/OxiDB"
keywords = ["database", "testing", "constraints"]
categories = ["database-implementations"]

[dependencies]
oxidb = { path = "../../" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] } # For potential use with data structures if needed later
clap = { version = "4.0", features = ["derive"] } # For potential CLI args if tests grow
